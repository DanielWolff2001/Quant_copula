name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg          # no display on the runner
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (newest compatible versions)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard,notebooks]"
      - name: Test
        run: pytest -q --durations=10

  locked:
    # The exact versions in requirements-lock.txt. Informational: the lock was made on macOS, so a
    # failure here means a pin has no Linux build, not that the code is broken.
    name: tests with the pinned lock file
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      - name: Test
        run: pytest -q

  package:
    name: build and install the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel in a clean environment and run the command line
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/vine-risk --version
          /tmp/clean/bin/vine-risk --help
          /tmp/clean/bin/python -c "import vine_risk; print(vine_risk.__version__)"

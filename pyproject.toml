[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vine-risk"
version = "0.1.0"
description = "Dynamic vine copula risk monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",
    "matplotlib",
    "pyyaml",
    "yfinance",
    "pyvinecopulib",
    "networkx",
]

[project.optional-dependencies]
dev = ["pytest"]
dashboard = ["streamlit", "plotly"]
notebooks = ["jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that need internet access"]

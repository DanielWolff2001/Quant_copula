assets: [AAPL, MSFT, NVDA, JPM, XOM, JNJ, SPY, TLT]

data:
  frequency: daily
  start: "2005-01-01"
  end: null            # null = today
  cache_dir: data/cache
  max_missing_frac: 0.05   # drop tickers with more missing prices than this
  max_ffill_days: 3        # forward-fill gaps up to this length

rolling:
  window: 250
  refit_frequency: 1
  truncation_level: 3        # null = full vine
  selection_criterion: bic   # aic | bic | loglik
  n_jobs: 4                  # worker processes for batch runs
  tail_simulations: 16384    # simulated points for model-implied tail dependence
  tail_level: 0.05           # q in lambda_L(q) = P(U2<q | U1<q)

risk:
  confidence_level: 0.99
  simulations: 16384         # Sobol points per window (power of 2)
  weights: null              # null = equal weights; or a list with one weight per asset
  seed: 42
